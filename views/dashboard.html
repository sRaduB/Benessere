<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – BetterLife</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrapper">

    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <span class="brand-icon">🌿</span>
        <span class="brand-name">BetterLife</span>
      </a>
      <div class="navbar-links">
        <a href="/" onclick="logout(); return false;" class="btn btn-ghost btn-sm">Esci</a>
      </div>
    </nav>

    <div class="page-header fade-up">
      <h1>Ciao, <span id="username">—</span>!</h1>
      <p>Ecco il riepilogo del tuo benessere</p>
    </div>

    <div class="card-grid fade-up fade-up-1">
      <div class="stat-card">
        <span class="stat-label">Punteggio medio</span>
        <span class="stat-value" id="punteggioMedio">—</span>
        <span class="stat-unit">su 100</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Streak attuale</span>
        <span class="stat-value" id="streak">—</span>
        <span class="stat-unit">giorni</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Giorni monitorati</span>
        <span class="stat-value" id="giorniCount">—</span>
        <span class="stat-unit">totali</span>
      </div>
    </div>

    <div class="quick-nav fade-up fade-up-2">
      <a href="/inserimento" class="quick-nav-item">
        <span class="quick-nav-icon">📝</span>
        Inserisci oggi
      </a>
      <a href="/storico" class="quick-nav-item">
        <span class="quick-nav-icon">📊</span>
        Storico
      </a>
      <a href="/sfide" class="quick-nav-item">
        <span class="quick-nav-icon">🏆</span>
        Sfide
      </a>
      <a href="/classifica" class="quick-nav-item">
        <span class="quick-nav-icon">📈</span>
        Classifica
      </a>
    </div>

    <div class="card fade-up fade-up-3">
      <p class="section-title">📅 Ultimi 5 giorni</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Sonno</th><th>Acqua</th><th>Umore</th><th>Punteggio</th>
            </tr>
          </thead>
          <tbody id="ultimiDati">
            <tr><td colspan="5" style="color:var(--text-muted);text-align:center;padding:24px">Caricamento…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = '/login';
    document.getElementById('username').innerText = localStorage.getItem('username') || '—';

    async function load() {
      const res = await fetch(`/api/user/${userId}`);
      const data = await res.json();
      document.getElementById('punteggioMedio').innerText = data.user.punti_totali || 0;
      document.getElementById('streak').innerText = data.user.streak || 0;
      document.getElementById('giorniCount').innerText = data.dati.length;
      const tbody = document.getElementById('ultimiDati');
      tbody.innerHTML = '';
      const slice = data.dati.slice(0, 5);
      if (!slice.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-muted);text-align:center;padding:24px">Nessun dato ancora</td></tr>';
        return;
      }
      for (let d of slice) {
        let umoreTxt = ['😢', '😟', '😐', '🙂', '😁'][d.umore - 1] || '😐';
        tbody.innerHTML += `<tr>
          <td>${d.data.slice(0,10)}</td>
          <td>${d.sonno}h</td>
          <td>${d.acqua}L</td>
          <td style="font-size:1.2rem">${umoreTxt}</td>
          <td><b>${d.punteggio}</b></td>
        </tr>`;
      }
    }

    function logout() { localStorage.clear(); window.location.href = '/'; }
    load();
  </script>
</body>
</html>
